<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mi Armario</title>
  <meta name="description" content="Administrador de inventario y ventas para tienda de ropa de bebés y niños">
  <meta name="theme-color" content="#F4A896">

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <span class="topbar-logo">🧸 Mi Armario</span>
      <button id="btn-install" class="install-btn" hidden>Instalar app</button>
    </header>

    <main id="view-container"></main>

    <nav class="bottom-nav">
      <button data-view="dashboard" class="active">
        <span class="nav-icon">🏠</span><span>Inicio</span>
      </button>
      <button data-view="products">
        <span class="nav-icon">👕</span><span>Productos</span>
      </button>
      <button data-view="sales">
        <span class="nav-icon">🛒</span><span>Ventas</span>
      </button>
      <button data-view="customers">
        <span class="nav-icon">👤</span><span>Clientes</span>
      </button>
      <button data-view="more">
        <span class="nav-icon">⋯</span><span>Más</span>
      </button>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-container"></div>

  <!-- Módulos (orden importa: database y utils primero) -->
  <script src="./js/database.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/inventory.js"></script>
  <script src="./js/sales.js"></script>
  <script src="./js/customers.js"></script>
  <script src="./js/filters.js"></script>
  <script src="./js/catalog.js"></script>
  <script src="./js/share.js"></script>
  <script src="./js/backup.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
